<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VidTú</title>
<meta name="theme-color" content="#f4f1ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ff;--solid:#f7f5ff;--ink:#17141f;--mute:#6b6680;--glass:rgba(255,255,255,.62);--stroke:rgba(255,255,255,.8);--shadow:0 8px 30px rgba(60,40,120,.13);--acc:#d4163c;--accb:#d4163c;--acc2:#7c4dff;--tab:64px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--blobo:.55}
[data-theme=dark]{--acc:#ff5a76;--bg:#0d0b16;--solid:#0f0d1a;--ink:#f3f0ff;--mute:#9b94b8;--glass:rgba(32,27,52,.62);--stroke:rgba(255,255,255,.09);--shadow:0 8px 30px rgba(0,0,0,.5);--blobo:.35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,-apple-system,sans-serif;font-size:15px;overflow-x:hidden;transition:background .3s}
h1,h2,h3{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}
.blob{position:fixed;width:62vmax;height:62vmax;border-radius:50%;filter:blur(90px);opacity:var(--blobo);z-index:-1;animation:float 24s ease-in-out infinite alternate;pointer-events:none}
.b1{background:var(--acc);top:-25vmax;left:-20vmax}
.b2{background:var(--acc2);bottom:-25vmax;right:-22vmax;animation-delay:-8s}
.b3{background:#22d3ee;top:35%;left:30%;width:40vmax;height:40vmax;opacity:calc(var(--blobo)*.55);animation-delay:-14s}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.glass{background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}

header.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 10px) 16px 8px}
header.top h1{font-size:23px;font-weight:800;letter-spacing:-.5px;flex:1;display:flex;align-items:center;gap:8px}
.logo{width:34px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--accb),var(--acc2));display:grid;place-items:center;color:#fff}
.logo svg{width:14px;height:14px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.ib:active{transform:scale(.92)}
main{padding:0 14px calc(var(--tab) + var(--sb) + 110px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;font-weight:600;font-size:13.5px;background:var(--glass);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.chip.on{background:var(--ink);color:var(--bg);border-color:transparent}
h2.sec{font-size:18px;margin:6px 2px 10px;display:flex;align-items:center;justify-content:space-between}
h2.sec small{font:500 13px 'Public Sans';color:var(--mute)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{border-radius:22px;overflow:hidden;animation:rise .5s both;animation-delay:calc(var(--i,0)*45ms);cursor:pointer}
.th{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#2b2447,#4b2a5c);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th img.v{object-fit:contain;background:#000}
.ph{width:100%;height:100%;display:grid;place-items:center;font:800 54px 'Bricolage Grotesque';color:rgba(255,255,255,.55)}
.dur{position:absolute;right:8px;bottom:10px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:600;padding:2px 7px;border-radius:7px}
.bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.35)}
.bar b{display:block;height:100%;background:var(--acc)}
.meta{display:flex;gap:11px;padding:11px 8px 12px 13px;align-items:flex-start}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 16px 'Bricolage Grotesque';color:#fff;background:linear-gradient(135deg,var(--accb),var(--acc2))}
.tx{flex:1;min-width:0}
.tx h3{font-size:15.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:'Public Sans',sans-serif}
.tx p{margin:3px 0 0;color:var(--mute);font-size:12.5px}
.mo{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.hrow{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none;margin:0 -14px;padding-left:14px;padding-right:14px}
.hrow::-webkit-scrollbar{display:none}
.hcard{flex:none;width:200px;border-radius:20px;overflow:hidden;animation:rise .5s both;animation-delay:calc(var(--i,0)*50ms);cursor:pointer}
.hcard .tx{padding:9px 11px 12px}
.hcard h3{font-size:13.5px}
.ring{position:absolute;left:8px;top:8px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.2}
.ring .t{stroke:rgba(255,255,255,.25)}.ring .p{stroke:var(--acc);stroke-linecap:round}
.ring span{font-size:9px;font-weight:700;color:#fff}
.empty{text-align:center;padding:60px 24px;animation:rise .6s both}
.empty .big{width:96px;height:96px;margin:0 auto 18px;border-radius:30px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accb),var(--acc2));box-shadow:0 14px 40px rgba(124,77,255,.4)}
.empty .big svg{width:42px;height:42px}
.empty h2{font-size:24px;margin-bottom:8px}.empty p{color:var(--mute);margin:0 0 22px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:99px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--accb),var(--acc2));box-shadow:0 8px 22px rgba(212,22,60,.3)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass);color:var(--ink);box-shadow:none;border:1px solid var(--stroke)}
.btn.danger{background:#c81e45}
.row{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:18px;margin-bottom:10px;animation:rise .45s both;animation-delay:calc(var(--i,0)*40ms);cursor:pointer}
.row .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accb),var(--acc2));color:#fff;flex:none}
.row .tx p{margin-top:1px}
.row .go{color:var(--mute)}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-radius:99px;margin:4px 0 14px}
.search input{flex:1;border:0;background:none;outline:0;color:var(--ink);font:inherit;font-size:16px;min-width:0}
.stats{display:flex;align-items:center;gap:16px;padding:16px;border-radius:24px;margin-bottom:14px}
.bigring{position:relative;width:84px;height:84px;flex:none;display:grid;place-items:center}
.bigring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.bigring circle{fill:none;stroke-width:8;stroke-linecap:round}
.bigring .t{stroke:rgba(128,120,160,.25)}.bigring .p{stroke:url(#g);transition:stroke-dashoffset 1s}
.bigring b{font:800 20px 'Bricolage Grotesque'}
.set{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-radius:18px;margin-bottom:10px}
.seg{display:flex;background:rgba(128,120,160,.18);border-radius:99px;padding:3px}
.seg button{padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg)}
.sw{width:50px;height:30px;border-radius:99px;background:rgba(128,120,160,.35);position:relative;transition:.25s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on{background:var(--accb)}.sw.on::after{left:23px}

nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(var(--sb) + 8px);height:var(--tab);border-radius:26px;display:flex;align-items:center;justify-content:space-around;z-index:30}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--mute);transition:.2s}
nav.tabs button.on{color:var(--acc)}
nav.tabs button.on svg{transform:translateY(-1px) scale(1.1)}
nav.tabs .plus{flex:none;width:56px;height:56px;border-radius:50%;margin-top:-26px;color:#fff;background:linear-gradient(135deg,var(--accb),var(--acc2));box-shadow:0 10px 26px rgba(212,22,60,.4);display:grid;place-items:center}
nav.tabs .plus svg{width:28px;height:28px;stroke-width:2.6;transform:none!important}
nav.tabs .plus:active{transform:scale(.92)}

.back{position:fixed;inset:0;background:rgba(10,8,20,.5);z-index:60;opacity:0;pointer-events:none;transition:.25s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;border-radius:28px 28px 0 0;padding:10px 18px calc(var(--sb) + 22px);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);max-height:88vh;overflow:auto;background:var(--solid);border:1px solid var(--stroke)}
.sheet.on{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:rgba(128,120,160,.4);margin:0 auto 14px}
.sheet h2{font-size:20px;margin:0 0 12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 6px;border-radius:14px;font-weight:500}
.opt:active{background:rgba(128,120,160,.15)}
.opt.sel{color:var(--acc);font-weight:700}
.opt.red{color:#e5304f}
.fld{width:100%;padding:14px 16px;border-radius:16px;border:1px solid rgba(128,120,160,.35);background:rgba(128,120,160,.1);color:var(--ink);font:inherit;font-size:16px;outline:0;margin-bottom:12px}
.fld:focus{border-color:var(--acc)}
.drop{border:2px dashed rgba(128,120,160,.45);border-radius:22px;padding:30px 18px;text-align:center;margin-bottom:14px}
.drop p{margin:6px 0 16px;color:var(--mute)}
.prog{margin-top:8px}.prog .pb{height:8px;border-radius:9px;background:rgba(128,120,160,.25);overflow:hidden;margin:8px 0}
.prog .pb b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accb),var(--acc2));transition:width .3s}
.prog small{color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--sb) + 90px);transform:translate(-50%,20px);padding:11px 18px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Reproductor */
.player{position:fixed;inset:0;z-index:50;background:var(--solid);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.3,1);visibility:hidden}
.player.on{transform:none;visibility:visible}
.player.full{padding-top:var(--st)}
#pv{position:relative;width:100%;aspect-ratio:16/9;max-height:56vh;background:#000;flex:none;touch-action:manipulation;overflow:hidden}
#pv video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
#tap{position:absolute;inset:0;z-index:1}
.ctl{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .25s;background:linear-gradient(rgba(0,0,0,.55),transparent 28%,transparent 62%,rgba(0,0,0,.65));color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.ctl.on{opacity:1}
.ctl.on button,.ctl.on input{pointer-events:auto}
.ctop{display:flex;align-items:center;gap:6px;padding:6px 8px}
.ctop span{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmid{display:flex;align-items:center;justify-content:center;gap:26px}
.cmid button{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.cmid .big{width:68px;height:68px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cmid .big svg{width:34px;height:34px}
.cbot{display:flex;align-items:center;gap:8px;padding:0 10px 8px;font-size:12px;font-weight:600}
.cbot button{min-width:36px;height:36px;display:grid;place-items:center;font-weight:700}
#seek{flex:1;height:30px;-webkit-appearance:none;appearance:none;background:none;margin:0}
#seek::-webkit-slider-runnable-track{height:4px;border-radius:9px;background:linear-gradient(90deg,var(--acc) var(--pct,0%),rgba(255,255,255,.35) var(--pct,0%))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--acc);margin-top:-5.5px;box-shadow:0 0 0 4px rgba(255,59,92,.25)}
#seek::-moz-range-track{height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
#seek::-moz-range-progress{height:4px;background:var(--acc)}
#seek::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--acc)}
.flash{position:absolute;top:0;bottom:0;width:34%;z-index:3;display:grid;place-items:center;color:#fff;font-weight:700;opacity:0;pointer-events:none;background:rgba(255,255,255,.16);font-size:15px}
.flash.l{left:0;border-radius:0 80% 80% 0}.flash.r{right:0;border-radius:80% 0 0 80%}
.flash.go{animation:fl .55s}
@keyframes fl{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.pbody{flex:1;overflow:auto;padding:14px 16px calc(var(--sb) + 20px);animation:rise .5s both}
.pbody h1{font-size:20px;line-height:1.25;font-weight:800}
.pbody .sub{color:var(--mute);font-size:13px;margin:5px 0 12px}
.acts{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.act{flex:none;display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:99px;background:rgba(128,120,160,.16);font-weight:600;font-size:13.5px}
.act.on{background:var(--accb);color:#fff}
.act svg{width:19px;height:19px}
.q{display:flex;gap:11px;margin-bottom:12px;cursor:pointer}
.q .th{width:150px;flex:none;border-radius:14px}
.q .tx h3{font-size:14px}
.minibar{display:none;flex:1;align-items:center;min-width:0;padding:0 4px 0 12px;gap:2px}
.minibar .mt{flex:1;min-width:0;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.player.mini{inset:auto 8px calc(var(--tab) + var(--sb) + 18px) 8px;height:62px;border-radius:18px;flex-direction:row;overflow:hidden;background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:0;z-index:25}
.player.mini #pv{width:110px;height:62px;max-height:none;aspect-ratio:auto}
.player.mini .ctl,.player.mini .flash,.player.mini .pbody{display:none}
.player.mini .minibar{display:flex}
.player.mini #pv:fullscreen{width:100%;height:100%}
#pv:fullscreen{max-height:none;width:100vw;height:100vh}
.player.vertical.full #pv{aspect-ratio:auto;height:68vh;max-height:none}
.fcard{display:flex;gap:12px;margin-bottom:14px;padding:12px;border-radius:18px;background:rgba(128,120,160,.1)}
.fcard .ft{width:92px;flex:none}.fcard .ft .th{border-radius:12px}
.fcard .ft .th.vt{aspect-ratio:9/16}
.fcard .fb{flex:1;min-width:0}.fcard .fld{margin-bottom:8px;padding:11px 13px;font-size:15px}
.fcard textarea.fld{resize:none;font-family:inherit}
.small{font-size:12.5px;color:var(--mute)}
input[type=range].fr{width:100%;accent-color:var(--accb);margin:4px 0 2px}
.mini2{padding:7px 12px;border-radius:99px;font-weight:600;font-size:12.5px;background:rgba(128,120,160,.2);margin-top:6px;display:inline-block}
.chk{display:flex;align-items:center;gap:10px;padding:8px 2px;font-weight:500}.chk input{width:20px;height:20px;accent-color:var(--accb)}
@media (orientation:landscape) and (max-height:520px){
 .player.full{flex-direction:row}
 .player.full #pv{width:62%;max-height:none;aspect-ratio:auto;height:100vh}
}
@media (min-width:900px){.player.full #pv{max-height:62vh}}
[hidden]{display:none!important}
#tap{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.badge2{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(0,0,0,.7);color:#fff;padding:5px 13px;border-radius:99px;font-weight:700;font-size:13px;opacity:0;transition:opacity .15s;pointer-events:none}
.badge2.on{opacity:1}
.pair{display:flex;gap:10px;margin:2px 0 14px}.pair .btn{flex:1;padding:12px 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="app"><div id="view"></div></div>

<nav class="tabs glass" id="tabs">
 <button data-act="tab" data-t="home"><span data-i="home"></span>Inicio</button>
 <button data-act="tab" data-t="search"><span data-i="search"></span>Buscar</button>
 <button class="plus" data-act="import" aria-label="Importar videos"><span data-i="plus"></span></button>
 <button data-act="tab" data-t="lists"><span data-i="list"></span>Listas</button>
 <button data-act="tab" data-t="you"><span data-i="user"></span>Tú</button>
</nav>

<section class="player" id="player" aria-label="Reproductor">
 <div id="pv">
  <video id="vid" playsinline preload="metadata"></video>
  <div id="tap"></div>
  <div class="badge2" id="b2">2× ▶▶ mantén pulsado</div><div class="flash l" id="fl"><span>« 10 s</span></div><div class="flash r" id="fr"><span>10 s »</span></div>
  <div class="ctl" id="ctl">
   <div class="ctop"><button class="ib" id="bMin" aria-label="Minimizar"><span data-i="down"></span></button><span id="ptop"></span><button class="ib" id="bPip" aria-label="Imagen en imagen" hidden><span data-i="pip"></span></button></div>
   <div class="cmid">
    <button id="bPrev" aria-label="Anterior"><span data-i="prev"></span></button>
    <button id="bPlay" class="big" aria-label="Reproducir"><span data-i="play"></span></button>
    <button id="bNext" aria-label="Siguiente"><span data-i="next"></span></button>
   </div>
   <div class="cbot"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posición"><span id="tDur">0:00</span><button id="bSpeed">1×</button><button id="bFs" aria-label="Pantalla completa"><span data-i="full"></span></button></div>
  </div>
 </div>
 <div class="minibar">
  <div class="mt" id="mtitle"></div>
  <button class="ib" id="mPlay" aria-label="Reproducir/Pausar"><span data-i="play"></span></button>
  <button class="ib" id="mClose" aria-label="Cerrar"><span data-i="x"></span></button>
 </div>
 <div class="pbody" id="pbody"></div>
</section>

<div class="back" id="back"></div>
<div class="sheet glass" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="video/*" multiple hidden>
<input type="file" id="file3" accept="image/*" hidden>
<input type="file" id="file2" accept=".mp4,.m4v,.mov,.mkv,.webm,.3gp,.avi" multiple hidden>

<script>
'use strict';
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,9));
const ICON={

function hydrateIcons(root=document){root.querySelectorAll('[data-i]').forEach(e=>{if(!e.dataset.done||e.dataset.done!==e.dataset.i){e.innerHTML=ic(e.dataset.i);e.style.display='contents';e.dataset.done=e.dataset.i}})}
const fmt=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const fsize=b=>b>=1073741824?(b/1073741824).toFixed(2)+' GB':b>=1048576?(b/1048576).toFixed(b>=1.05e8?0:1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function ago(t){const d=(Date.now()-t)/1000;if(d<60)return'hace un momento';if(d<3600)return`hace ${Math.floor(d/60)} min`;if(d<86400){const h=Math.floor(d/3600);return`hace ${h} ${h===1?'hora':'horas'}`}if(d<2592000){const n=Math.floor(d/86400);return`hace ${n} ${n===1?'día':'días'}`}if(d<31536000){const n=Math.floor(d/2592000);return`hace ${n} ${n===1?'mes':'meses'}`}const n=Math.floor(d/31536000);return`hace ${n} ${n===1?'año':'años'}`}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}

/* ---------- base de datos (IndexedDB) ---------- */
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('videoteca',1);
 r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('videos',{keyPath:'id'});d.createObjectStore('blobs',{keyPath:'id'});d.createObjectStore('lists',{keyPath:'id'})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const store=async(n,m='readonly')=>(await dbp).transaction(n,m).objectStore(n);
const dbAll=async n=>rq((await store(n)).getAll());
const dbGet=async(n,k)=>rq((await store(n)).get(k));
const dbPut=async(n,v)=>rq((await store(n,'readwrite')).put(v));
const dbDel=async(n,k)=>rq((await store(n,'readwrite')).delete(k));
const dbClear=async n=>rq((await store(n,'readwrite')).clear());

/* ---------- estado ---------- */
const LS={get(k,d){try{const v=localStorage.getItem('vt_'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('vt_'+k,JSON.stringify(v))}catch{}}};
const S={videos:[],lists:[],tab:'home',filter:'all',sort:LS.get('sort','recent'),q:'',theme:LS.get('theme','auto'),auto:LS.get('auto',true),sub:null,ctx:[]};

function applyTheme(){
 const dark=S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
 document.documentElement.dataset.theme=dark?'dark':'light';
 $('meta[name=theme-color]').content=dark?'#0d0b16':'#f4f1ff';
}
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',applyTheme);

async function load(){S.videos=await dbAll('videos');S.lists=await dbAll('lists')}
const folders=()=>[...new Set(S.videos.map(v=>v.folder).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
const byId=id=>S.videos.find(v=>v.id===id);
const pct=v=>v.duration?Math.min(100,Math.round((v.pos||0)/v.duration*100)):0;
const inProgress=v=>(v.pos||0)>3&&pct(v)<95&&!v.done;

function sorted(arr){
 const a=[...arr];
 const f={recent:(x,y)=>y.added-x.added,name:(x,y)=>x.title.localeCompare(y.title,'es',{numeric:true}),long:(x,y)=>y.duration-x.duration,big:(x,y)=>y.size-x.size,seen:(x,y)=>(y.last||0)-(x.last||0)}[S.sort]||((x,y)=>y.added-x.added);
 return a.sort(f);
}
function filtered(){
 let a=S.videos;
 switch(S.filter){case'new':a=a.filter(v=>!v.last);break;case'seen':a=a.filter(v=>v.last);break;case'fav':a=a.filter(v=>v.fav);break;case'later':a=a.filter(v=>v.later);break}
 return sorted(a);
}

/* ---------- tarjetas ---------- */
const ringSvg=(p,size=34)=>{const r=size/2-3.2,c=2*Math.PI*r;return`<svg viewBox="0 0 ${size} ${size}"><circle class="t" cx="${size/2}" cy="${size/2}" r="${r}"/><circle class="p" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}"/></svg>`};
const isVert=v=>!!(v.w&&v.h&&v.h>v.w);
const thumb=v=>v.thumb?`<img class="${isVert(v)?'v':''}" src="${v.thumb}" alt="" loading="lazy">`:`<div class="ph">${esc((v.title[0]||'▶').toUpperCase())}</div>`;
function card(v,i=0){
 const p=pct(v);
 return`<article class="card glass" data-act="play" data-id="${v.id}" style="--i:${Math.min(i,12)}">
 <div class="th">${thumb(v)}<span class="dur">${fmt(v.duration)}</span>${p>0&&!v.done?`<i class="bar"><b style="width:${p}%"></b></i>`:''}</div>
 <div class="meta"><div class="av">${esc((v.title[0]||'V').toUpperCase())}</div>
 <div class="tx"><h3>${esc(v.title)}</h3><p>${fsize(v.size)} · ${ago(v.added)}${v.fav?' · ♥':''}</p></div>
 <button class="mo" data-act="menu" data-id="${v.id}" aria-label="Más opciones">${ic('more')}</button></div></article>`;
}
function hcard(v,i){
 const p=pct(v);
 return`<article class="hcard glass" data-act="play" data-id="${v.id}" style="--i:${i}">
 <div class="th">${thumb(v)}<div class="ring">${ringSvg(p)}<span>${p}</span></div><span class="dur">${fmt(Math.max(0,v.duration-(v.pos||0)))} rest.</span><i class="bar"><b style="width:${p}%"></b></i></div>
 <div class="tx"><h3>${esc(v.title)}</h3></div></article>`;
}
const topbar=(title,right='')=>`<header class="top"><h1>${title}</h1>${right}</header>`;
const themeBtn=()=>`<button class="ib glass" data-act="theme" aria-label="Cambiar tema">${ic(document.documentElement.dataset.theme==='dark'?'sun':'moon')}</button>`;
const emptyHtml=()=>`<div class="empty"><div class="big">${ic('film')}</div><h2>Tu biblioteca está vacía</h2><p>Importa los videos de tu teléfono y quedarán guardados dentro de la app, listos para ver sin internet.</p><button class="btn" data-act="import">${ic('plus')} Importar videos</button></div>`;

function vHome(){
 const logo=`<span class="logo">${ic('play','f')}</span>VidTú`;
 let h=topbar(logo,`<button class="ib glass" data-act="sheet-sort" aria-label="Ordenar">${ic('sort')}</button>${themeBtn()}`);
 if(!S.videos.length){view.innerHTML=h+`<main>${emptyHtml()}</main>`;return}
 const chips=[['all','Todos'],['new','Sin ver'],['seen','Vistos'],['fav','Favoritos'],['later','Ver luego']];

function vSearch(){
 view.innerHTML=topbar('Buscar',themeBtn())+`<main><label class="search glass">${ic('search')}<input id="q" type="search" placeholder="Buscar en tu biblioteca" value="${esc(S.q)}" autocomplete="off"></label><div id="res"></div></main>`;
 const run=()=>{
  const q=S.q.trim().toLowerCase();const r=$('#res');
  if(!S.videos.length){r.innerHTML=emptyHtml();return}
  const list=sorted(S.videos).filter(v=>!q||v.title.toLowerCase().includes(q)||(v.desc||'').toLowerCase().includes(q)||(v.folder||'').toLowerCase().includes(q));S.ctx=list.map(v=>v.id);
  r.innerHTML=list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty"><p>Sin resultados para “${esc(S.q)}”.</p></div>`;hydrateIcons(r);
 };
 $('#q').addEventListener('input',e=>{S.q=e.target.value;run()});run();
}
const listCount=id=>id==='fav'?S.videos.filter(v=>v.fav).length:id==='later'?S.videos.filter(v=>v.later).length:(S.lists.find(l=>l.id===id)?.ids.filter(byId).length||0);

 let list=fold!==null?sorted(S.videos.filter(v=>v.folder===fold)):id==='fav'?S.videos.filter(v=>v.fav):id==='later'?S.videos.filter(v=>v.later):id==='hist'?S.videos.filter(v=>v.last).sort((a,b)=>b.last-a.last):(custom?custom.ids.map(byId).filter(Boolean):[]);

 view.innerHTML=`<header class="top"><button class="ib glass" data-act="back" aria-label="Volver">${ic('prev')}</button><h1>${esc(name)}</h1>${extra}</header><main>`+

async function vYou(){
 const total=S.videos.length,seen=S.videos.filter(v=>v.done||pct(v)>=95).length;
 const p=total?Math.round(seen/total*100):0;const bytes=S.videos.reduce((a,v)=>a+v.size,0);

let namesRes=null;
let SRC={};

const safeName=x=>(String(x||'').replace(/[\\/:*?"<>|\u0000-\u001f]/g,' ').replace(/\s+/g,' ').trim().replace(/[. ]+$/,'')||'video').slice(0,120);

function fileNames(vs){const used=new Map();return vs.map(v=>{let base=safeName(v.title),ext=extOf(v),n=base+'.'+ext,i=1;while(used.has(n.toLowerCase())){i++;n=`${base} (${i}).${ext}`}used.set(n.toLowerCase(),1);return n})}

const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
async function crcOf(blob,onp){let c=0xFFFFFFFF;const CH=4194304;for(let o=0;o<blob.size;o+=CH){const b=new Uint8Array(await blob.slice(o,o+CH).arrayBuffer());for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);onp&&onp(Math.min(1,(o+CH)/blob.size))}return(c^0xFFFFFFFF)>>>0}
async function buildZip(entries,onp){
 const enc=new TextEncoder(),parts=[],central=[];let off=0,csize=0;
 for(let i=0;i<entries.length;i++){
  const e=entries[i],nb=enc.encode(e.name),crc=await crcOf(e.blob,p=>onp&&onp(i,p)),d0=new Date(e.date||Date.now());
  const t=(d0.getHours()<<11)|(d0.getMinutes()<<5)|(d0.getSeconds()>>1),d=((d0.getFullYear()-1980)<<9)|((d0.getMonth()+1)<<5)|d0.getDate();
  const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,t,true);lh.setUint16(12,d,true);lh.setUint32(14,crc,true);lh.setUint32(18,e.blob.size,true);lh.setUint32(22,e.blob.size,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
  parts.push(lh.buffer,nb,e.blob);
  const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,t,true);ch.setUint16(14,d,true);ch.setUint32(16,crc,true);ch.setUint32(20,e.blob.size,true);ch.setUint32(24,e.blob.size,true);ch.setUint16(28,nb.length,true);ch.setUint32(42,off,true);
  central.push(ch.buffer,nb);csize+=46+nb.length;off+=30+nb.length+e.blob.size;
 }
 const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,csize,true);end.setUint32(16,off,true);

$('#mPlay').onclick=()=>$('#bPlay').onclick();
$('#bNext').onclick=next;$('#bPrev').onclick=prev;
$('#bMin').onclick=()=>{history.state?.p?history.back():minimize()};
$('#mClose').onclick=closePlayer;
$('#mtitle').onclick=()=>expand();
$('#bSpeed').onclick=()=>{const o=[1,1.25,1.5,1.75,2,0.75];const i=o.indexOf(vid.playbackRate);setSpeed(o[(i+1)%o.length])};
$('#bFs').onclick=async()=>{
 const pv=$('#pv');
 if(document.fullscreenElement){document.exitFullscreen();return}
 try{if(pv.requestFullscreen){await pv.requestFullscreen();try{await screen.orientation?.lock?.(isVert(byId(P.id)||{})?'portrait':'landscape')}catch{}}else if(vid.webkitEnterFullscreen)vid.webkitEnterFullscreen()}catch{if(vid.webkitEnterFullscreen)vid.webkitEnterFullscreen()}
};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){try{screen.orientation?.unlock?.()}catch{}}});
let lastTap=0,tapT=0,lpOn=false,lpT=0,prevRate=1,sy=null;
function setSpeed(x){vid.playbackRate=x;LS.set('speed',x);$('#bSpeed').textContent=x+'×';if(P.id)fillInfo()}
{const tap=$('#tap'),b2=$('#b2');
 tap.addEventListener('pointerdown',()=>{if(player.classList.contains('mini'))return;clearTimeout(lpT);lpT=setTimeout(()=>{lpOn=true;prevRate=vid.playbackRate;vid.playbackRate=2;b2.classList.add('on')},450)});
 const endLP=()=>{clearTimeout(lpT);if(lpOn){vid.playbackRate=prevRate;b2.classList.remove('on');setTimeout(()=>{lpOn=false},60)}};
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>tap.addEventListener(ev,endLP));
 tap.addEventListener('contextmenu',e=>e.preventDefault());
 tap.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});
 tap.addEventListener('touchend',e=>{if(sy==null)return;const dy=e.changedTouches[0].clientY-sy;sy=null;if(dy>90&&player.classList.contains('full')&&!document.fullscreenElement){history.state?.p?history.back():minimize()}});
}
if(document.pictureInPictureEnabled){const b=$('#bPip');b.hidden=false;b.onclick=async()=>{try{document.pictureInPictureElement?await document.exitPictureInPicture():await vid.requestPictureInPicture()}catch{toast('Este navegador no permite imagen en imagen')}}}
$('#tap').addEventListener('click',e=>{
 if(lpOn)return;
 if(player.classList.contains('mini')){expand();return}
 const r=e.currentTarget.getBoundingClientRect(),x=e.clientX-r.left,side=x<r.width/3?-1:x>r.width*2/3?1:0,now=Date.now();
 if(side&&now-lastTap<330){clearTimeout(tapT);const n=SKIP();vid.currentTime=Math.max(0,Math.min(vid.duration||1e9,vid.currentTime+side*n));$('#fl span').textContent='« '+n+' s';$('#fr span').textContent=n+' s »';const f=$(side<0?'#fl':'#fr');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');lastTap=now;showCtl();return}
 lastTap=now;clearTimeout(tapT);tapT=setTimeout(()=>ctl.classList.contains('on')?hideCtl():showCtl(),330);
});
window.addEventListener('popstate',()=>{if(player.classList.contains('full'))minimize()});
document.addEventListener('keydown',e=>{
 if(!P.id||/input|textarea/i.test(e.target.tagName))return;
 if(e.key===' '){e.preventDefault();$('#bPlay').onclick()}
 else if(e.key==='ArrowRight')vid.currentTime+=SKIP();else if(e.key==='ArrowLeft')vid.currentTime-=SKIP();
 else if(e.key==='f')$('#bFs').onclick();else if(e.key==='Escape'&&!document.fullscreenElement)minimize();
});
async function enterPip(){
 if(!document.pictureInPictureEnabled||!vid.src||vid.paused||document.pictureInPictureElement)return;
 try{await vid.requestPictureInPicture()}catch{}
}
vid.addEventListener('enterpictureinpicture',()=>{ctl.classList.remove('on')});
vid.addEventListener('leavepictureinpicture',()=>{if(P.id&&!document.hidden)showCtl()});
try{vid.autoPictureInPicture=true}catch{}
vid.setAttribute('autopictureinpicture','');
addEventListener('pagehide',persistPos);
document.addEventListener('visibilitychange',()=>{if(document.hidden){persistPos();enterPip()}});

/* ---------- acciones ---------- */
async function saveVideo(v){await dbPut('videos',v)}
async function removeVideo(id){
 if(P.id===id)closePlayer();
 await dbDel('videos',id);await dbDel('blobs',id);
 S.videos=S.videos.filter(v=>v.id!==id);
 for(const l of S.lists){if(l.ids.includes(id)){l.ids=l.ids.filter(x=>x!==id);await dbPut('lists',l)}}
}
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const a=t.dataset.act,id=t.dataset.id;
 if(a==='menu'){e.stopPropagation();sheetMenu(id);return}
 switch(a){
  case'tab':S.tab=t.dataset.t;S.sub=null;render();scrollTo(0,0);break;
  case'import':sheetImport();break;
  case'pick':fileIn.click();break;
  case'dl':closeSheet();downloadOne(id);break;
  case'dlgroup':{const f=S.sub.startsWith('f:')?S.sub.slice(2):(S.lists.find(l=>l.id===S.sub)?.name||'Lista');DL={name:f,ids:[...S.ctx]};sheetDownload();break}
  case'dlzip':doDownload(true);break;
  case'dlsep':doDownload(false);break;
  case'importgo':{const r=namesRes;namesRes=null;const F0=readForm(IM.metas.length);cleanSrc();r&&r(F0);break}
  case'foto':fotoTarget=t.dataset.i;fileIn3.click();break;
  case'efoto':fotoTarget='edit';fileIn3.click();break;
  case'pick2':fileIn2.click();break;
  case'chip':S.filter=t.dataset.k;render();break;
  case'sheet-sort':sheetSort();break;
  case'dosort':S.sort=t.dataset.k;LS.set('sort',S.sort);closeSheet();render();break;
  case'theme':S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';LS.set('theme',S.theme);applyTheme();render();break;
  case'settheme':S.theme=t.dataset.k;LS.set('theme',S.theme);applyTheme();render();break;
  case'auto':S.auto=!S.auto;LS.set('auto',S.auto);t.classList.toggle('on',S.auto);break;
  case'play':{closeSheet();const keep=t.dataset.keepq;await openVideo(id,keep?null:[...S.ctx]);break}
  case'playall':if(S.ctx.length)openVideo(S.ctx[0],[...S.ctx]);break;
  case'fav':case'later':{const v=byId(id);v[a]=!v[a];await saveVideo(v);closeSheet();toast(a==='fav'?(v.fav?'Agregado a favoritos':'Quitado de favoritos'):(v.later?'Guardado en Ver más tarde':'Quitado de Ver más tarde'));if(P.id===id)fillInfo();render();break}
  case'addlist':sheetAddList(id);break;
  case'toggleinlist':{const l=S.lists.find(x=>x.id===t.dataset.l);l.ids=l.ids.includes(id)?l.ids.filter(x=>x!==id):[...l.ids,id];await dbPut('lists',l);sheetAddList(id);render();break}
  case'newlist':sheetNewList();break;
  case'createlist':{const n=$('#nl').value.trim();if(!n){$('#nl').focus();return}const l={id:uid(),name:n,ids:id?[id]:[]};await dbPut('lists',l);S.lists.push(l);closeSheet();toast('Lista creada');render();break}
  case'openlist':S.sub=id;render();scrollTo(0,0);break;
  case'back':S.sub=null;render();break;
  case'dellist':{const l=S.lists.find(x=>x.id===id);sheetConfirm(`¿Eliminar la lista “${esc(l.name)}”?`,'dodellist','Eliminar');sheet.dataset.l=id;break}
  case'dodellist':{const id2=sheet.dataset.l;await dbDel('lists',id2);S.lists=S.lists.filter(l=>l.id!==id2);S.sub=null;closeSheet();render();break}
  case'rename':sheetRename(id);break;
  case'dorename':{const n=$('#rn').value.trim();if(!n)return;const v=byId(id);v.title=n;v.desc=$('#rd').value.trim();if(editThumb){v.thumb=editThumb;editThumb=null}await saveVideo(v);closeSheet();if(P.id===id)fillInfo();render();break}
  case'del':{const v=byId(id);sheetConfirm(`¿Eliminar “${esc(v.title)}”?`,'dodel','Eliminar');sheet.dataset.v=id;break}
  case'dodel':{const id2=sheet.dataset.v;await removeVideo(id2);closeSheet();toast('Video eliminado');render();break}
  case'wipe':sheetConfirm('¿Borrar toda la biblioteca?','dowipe','Borrar todo');break;
  case'dowipe':{closePlayer();await dbClear('videos');await dbClear('blobs');await dbClear('lists');S.videos=[];S.lists=[];closeSheet();toast('Biblioteca vacía');render();break}
  case'movef':sheetMove(id);break;
  case'setfolder':{const v=byId(id);v.folder=t.dataset.f||'';await saveVideo(v);closeSheet();toast(v.folder?`Movido a ${v.folder}`:'Sin carpeta');render();break}
  case'newfolder':{const n=$('#nf').value.trim();if(!n){$('#nf').focus();return}const v=byId(id);v.folder=n.slice(0,40);await saveVideo(v);closeSheet();toast(`Movido a ${v.folder}`);render();break}
  case'renfolder':{openSheet(`<h2>Renombrar carpeta</h2><input class="fld" id="rf" value="${esc(S.sub.slice(2))}" maxlength="40"><button class="btn" style="width:100%" data-act="dorenfolder">Guardar</button>`);break}
  case'dorenfolder':{const n=$('#rf').value.trim().slice(0,40);if(!n)return;const old=S.sub.slice(2);for(const v of S.videos)if(v.folder===old){v.folder=n;await saveVideo(v)}S.sub='f:'+n;closeSheet();render();break}
  case'delfolder':{const old=S.sub.slice(2);sheetConfirm(`¿Deshacer la carpeta “${esc(old)}”?`,'dodelfolder','Deshacer');break}
  case'dodelfolder':{const old=S.sub.slice(2);for(const v of S.videos)if(v.folder===old){v.folder='';await saveVideo(v)}S.sub=null;closeSheet();toast('Carpeta deshecha; los videos se conservan');render();break}
  case'queue':{closeSheet();if(!P.id){await openVideo(id,[id]);break}const q=P.queue.filter(x=>x!==id);q.splice(q.indexOf(P.id)+1,0,id);P.queue=q;fillInfo();toast('Se reproducirá a continuación');break}
  case'lup':case'ldown':{const l=S.lists.find(x=>x.id===S.sub);const i=l.ids.indexOf(id),j=a==='lup'?i-1:i+1;if(j<0||j>=l.ids.length){closeSheet();break}[l.ids[i],l.ids[j]]=[l.ids[j],l.ids[i]];await dbPut('lists',l);closeSheet();render();break}
  case'lrem':{const l=S.lists.find(x=>x.id===S.sub);l.ids=l.ids.filter(x=>x!==id);await dbPut('lists',l);closeSheet();toast('Quitado de la lista');render();break}
  case'clearseen':{let n=0;if(S.sub==='later'){for(const v of S.videos)if(v.later&&v.done){v.later=false;await saveVideo(v);n++}}else{const l=S.lists.find(x=>x.id===S.sub);if(l){const keep=l.ids.filter(x=>!byId(x)?.done);n=l.ids.length-keep.length;l.ids=keep;await dbPut('lists',l)}}toast(n?`${n} vistos quitados`:'No hay videos vistos aquí');render();break}
  case'setskip':LS.set('skip',+t.dataset.k);render();break;
  case'sheet-speed':sheetSpeed();break;
  case'setspeed':{setSpeed(+t.dataset.s);closeSheet();break}
  case'closesheet':closeSheet();break;
 }
});

/* ---------- inicio ---------- */
(async()=>{
 applyTheme();hydrateIcons();
 try{await load()}catch(e){console.error(e)}
 render();
 if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
